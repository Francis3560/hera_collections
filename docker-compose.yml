version: '3.8'

services:

  server:
    build:
      context: ./Hera_Collection_Server
      dockerfile: Dockerfile
    ports:
      - "8080"
   
    volumes:
      - ./Hera_Collection_Server/uploads:/app/uploads

  client:
    build:
      context: ./Hera_Collection_Client
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8080
    ports:
      - "80"
    depends_on:
      - server
